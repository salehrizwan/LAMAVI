<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch;
          var patchTarget = function (target) {
            if (!target) return;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function () {
                  return currentFetch;
                },
                set: function (fn) {
                  if (typeof fn === 'function') {
                    currentFetch = fn;
                  }
                },
                configurable: true,
                enumerable: true,
              });
            } catch (err) {}
          };
          patchTarget(window);
          patchTarget( globalThis );
          if (typeof Window !== 'undefined' && Window.prototype) {
            patchTarget(Window.prototype);
          }
          window.addEventListener(
            'error',
            function (e) {
              if (
                (e.filename && e.filename.indexOf('chrome-extension://') === 0) ||
                (e.message && e.message.indexOf('Cannot set property fetch') !== -1)
              ) {
                e.stopImmediatePropagation();
                e.preventDefault();
                return false;
              }
            },
            true
          );
          window.addEventListener(
            'unhandledrejection',
            function (e) {
              var msg = e.reason && (e.reason.message || String(e.reason));
              if (msg && msg.indexOf('Cannot set property fetch') !== -1) {
                e.stopImmediatePropagation();
                e.preventDefault();
                return false;
              }
            },
            true
          );
        } catch (e) {}
      })();
    </script>
